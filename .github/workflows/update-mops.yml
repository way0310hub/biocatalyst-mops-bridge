name: Update MOPS data
# temporary diagnostic push run

concurrency:
  group: biocatalyst-mops-update
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "MOPS 回補天數（例：7 或 365）"
        required: false
        default: "7"
      history_codes:
        description: "公司代號（逗號分隔；例如 6949,7729,6696）"
        required: false
        default: ""
  push:
    paths:
      - "fetch_mops.py"
      - ".github/workflows/update-mops.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser for MOPS history query
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Query MOPS history through official page
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        env:
          MOPS_HISTORY_CODES: ${{ github.event_name == 'workflow_dispatch' && inputs.history_codes || '6949,7729,6696' }}
          MOPS_HISTORY_DAYS: ${{ inputs.lookback_days || '365' }}
        run: node fetch_mops_history.mjs

      - name: Fetch official data
        env:
          MOPS_LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
          MOPS_HISTORY_CODES: ${{ github.event_name == 'workflow_dispatch' && inputs.history_codes || '6949,7729,6696' }}
        run: python fetch_mops.py

      - name: Publish updated JSON
        run: |
          git config user.name "BioCatalyst MOPS Bridge"
          git config user.email "actions@users.noreply.github.com"
          git add public/mops.json
          git diff --cached --quiet || git commit -m "chore: update MOPS data"
          git push
