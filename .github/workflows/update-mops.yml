name: Update MOPS data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official data
        run: python fetch_mops.py

      - name: Publish updated JSON
        run: |
          git config user.name "BioCatalyst MOPS Bridge"
          git config user.email "actions@users.noreply.github.com"
          git add public/mops.json
          git diff --cached --quiet || git commit -m "chore: update MOPS data"
          git push
