name: Update MOPS data

concurrency:
  group: biocatalyst-mops-update
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "MOPS 回補天數（例：7 或 365）"
        required: false
        default: "7"
  push:
    paths:
      - "fetch_mops.py"
      - ".github/workflows/update-mops.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official data
        env:
          MOPS_LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
        run: python fetch_mops.py

      - name: Publish updated JSON
        run: |
          git config user.name "BioCatalyst MOPS Bridge"
          git config user.email "actions@users.noreply.github.com"
          git add public/mops.json
          git diff --cached --quiet || git commit -m "chore: update MOPS data"
          git push
